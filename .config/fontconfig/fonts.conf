<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

<!-- 全局默认字体 -->

  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono CN</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>sans-serif</string>
    </edit>
  </match>

<!-- CJK 特殊设置 -->

  <!-- 简体中文 -->
  <match>
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match>
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- 繁体中文 -->
  <match>
    <test name="lang" compare="contains">
      <string>zh_HK</string>
    </test>
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK HK</string>
    </edit>
  </match>

  <match>
    <test name="lang" compare="contains">
      <string>zh_HK</string>
    </test>
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK HK</string>
    </edit>
  </match>

  <match>
    <test name="lang" compare="contains">
      <string>zh_TW</string>
    </test>
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TW</string>
    </edit>
  </match>

  <match>
    <test name="lang" compare="contains">
      <string>zh_TW</string>
    </test>
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TW</string>
    </edit>
  </match>

  <!-- 日语 -->
  <match>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <!-- 韩语 -->
  <match>
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <match>
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>

<!-- 回退字体 -->

  <alias>
    <family>Noto Sans</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>Noto Serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>Maple Mono CN</family>
    <prefer>
      <family>Maple Mono CN</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

</fontconfig>
