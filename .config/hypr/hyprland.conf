# Copyright © 2025 hiruocha

$terminal = footclient
$menu = rofi -show drun

general {
  border_size = 0
  gaps_in = 8
  gaps_out = 16
  resize_on_border = true
  extend_border_grab_area = 8
}

decoration {
  rounding = 12
  dim_inactive = true
  dim_strength = 0.2
  blur {
    enabled = false
  }
  shadow {
    enabled = false
  }
}

animations {
  enabled = yes

  # https://m3.material.io/styles/motion/overview/specs
  bezier = Expressive fast spatial,    0.42, 1.67, 0.21, 0.9
  bezier = Expressive default spatial, 0.38, 1.21, 0.22, 1
  bezier = Expressive slow spatial,    0.39, 1.29, 0.35, 0.98
  bezier = Expressive fast effects,    0.31, 0.94, 0.34, 1
  bezier = Expressive default effects, 0.34, 0.8,  0.34, 1
  bezier = Expressive slow effects,    0.34, 0.88, 0.34, 1
  bezier = Standard fast spatial,      0.27, 1.06, 0.18, 1
  bezier = Standard default spatial,   0.27, 1.06, 0.18, 1
  bezier = Standard slow spatial,      0.27, 1.06, 0.18, 1
  bezier = Standard fast effects,      0.31, 0.94, 0.34, 1
  bezier = Standard default effects,   0.34, 0.8,  0.34, 1
  bezier = Standard slow effects,      0.34, 0.88, 0.34, 1

  animation = global,     1,     5,     Expressive default spatial
  animation = windowsOut, 1,     3.5,   Standard fast spatial
  animation = layers,     1,     5,     Standard default spatial
  animation = fade,       1,     2,     Standard default effects
  animation = workspaces, 1,     6.5,   Expressive slow spatial
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

exec-once = waybar
exec-once = foot --server
exec-once = systemctl --user start hyprpolkitagent
exec-once = qbittorrent-nox
exec-once = dex -a
exec-once = $terminal

env = LANG,zh_CN.UTF-8
env = XMODIFIERS,@im=fcitx

$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

bind = $mainMod CTRL, H, resizeactive, -20 0
bind = $mainMod CTRL, L, resizeactive, 20 0
bind = $mainMod CTRL, K, resizeactive, 0 -20
bind = $mainMod CTRL, J, resizeactive, 0 20

bind = $mainMod SHIFT, H, moveactive, -20 0
bind = $mainMod SHIFT, L, moveactive, 20 0
bind = $mainMod SHIFT, K, moveactive, 0 -20
bind = $mainMod SHIFT, J, moveactive, 0 20

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, I, workspace, e+1
bind = $mainMod, U, workspace, e-1

bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule = suppressevent maximize, class:.*
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

windowrule = float, class:QQ, title:.*
windowrule = tile, class:QQ, title:QQ

layerrule = animation slide, rofi
